server {
    listen 80;
    server_name hygnzm.abrdns.com 8.155.134.37;
    root /opt/code-notes/frontend;
    index index.html;

    location / { try_files $uri $uri/ =404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name 8.155.134.37;
    root /opt/code-notes/frontend;
    index index.html;
    ssl_certificate /var/lib/code-notes-acme/certificates/8.155.134.37.crt;
    ssl_certificate_key /var/lib/code-notes-acme/certificates/8.155.134.37.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CodeNotesSSL:1m;
    ssl_session_timeout 10m;

    location / { try_files $uri $uri/ =404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
