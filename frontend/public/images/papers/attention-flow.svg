<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" role="img" aria-labelledby="title desc">
<title id="title">匹配分数 → 注意力权重 → 新的向量</title><desc id="desc">缩放点积注意力依次计算QK转置，除以根号dk，遮掉非法连接，softmax得到权重A，最后用AV加权汇总V。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#829075"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#34432d} .secondary{fill:#626f57}</style>
<rect width="820" height="700" fill="#ffffff"/>
<text x="410.0" y="43" text-anchor="middle" font-size="24" font-weight="500" class="">匹配分数 → 注意力权重 → 新的向量</text>
<rect x="75" y="90" width="670" height="80" rx="10" fill="#edf3fc" stroke="#d7dfce"/>
<text x="410.0" y="119" text-anchor="middle" font-size="19" font-weight="500" class="">点积：QKᵀ</text>
<text x="410.0" y="145" text-anchor="middle" font-size="16" font-weight="400" class="secondary">每个查询与各位置的 K 计算匹配分数</text>
<path d="M 410 170 L 410 198" fill="none" stroke="#829075" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="75" y="198" width="670" height="80" rx="10" fill="#f0f2ec" stroke="#d7dfce"/>
<text x="410.0" y="227" text-anchor="middle" font-size="19" font-weight="500" class="">缩放：除以 √dk</text>
<text x="410.0" y="253" text-anchor="middle" font-size="16" font-weight="400" class="secondary">调整分数尺度</text>
<path d="M 410 278 L 410 306" fill="none" stroke="#829075" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="75" y="306" width="670" height="80" rx="10" fill="#fff5d5" stroke="#d7dfce"/>
<text x="410.0" y="335" text-anchor="middle" font-size="19" font-weight="500" class="">掩码（需要时）</text>
<text x="410.0" y="361" text-anchor="middle" font-size="16" font-weight="400" class="secondary">不允许读取的位置设为 −∞</text>
<path d="M 410 386 L 410 414" fill="none" stroke="#829075" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="75" y="414" width="670" height="80" rx="10" fill="#eef5e7" stroke="#d7dfce"/>
<text x="410.0" y="443" text-anchor="middle" font-size="19" font-weight="500" class="">Softmax → 权重 A</text>
<text x="410.0" y="469" text-anchor="middle" font-size="16" font-weight="400" class="secondary">同一查询的可见位置权重和为 1</text>
<path d="M 410 494 L 410 522" fill="none" stroke="#829075" stroke-width="1.7" marker-end="url(#arrow)" />
<rect x="75" y="522" width="670" height="80" rx="10" fill="#f3effa" stroke="#d7dfce"/>
<text x="410.0" y="551" text-anchor="middle" font-size="19" font-weight="500" class="">加权汇总：A V</text>
<text x="410.0" y="577" text-anchor="middle" font-size="16" font-weight="400" class="secondary">用权重汇总各位置的 V</text>
<text x="410" y="652" text-anchor="middle" font-size="17" font-weight="400" class="secondary">输出是一个新的表示向量；还要经过后续层，才能得到词表概率。</text>
<text x="410.0" y="682" text-anchor="middle" font-size="13" font-weight="400" class="secondary">根据 Vaswani et al. (2017) Figure 2 重绘 · 所有数值为教学示意</text>
</svg>